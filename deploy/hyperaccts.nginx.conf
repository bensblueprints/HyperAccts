server {
    listen 80;
    listen [::]:80;
    server_name hyperaccts.com www.hyperaccts.com;
    root /srv/hyperaccts/website;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(mjs|js)$ { default_type application/javascript; }
    location /downloads/ { types { application/octet-stream exe; } add_header Content-Disposition attachment; try_files $uri =404; }
    location = /server.mjs { return 404; }
}
