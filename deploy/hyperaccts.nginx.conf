server {
    server_name hyperaccts.com www.hyperaccts.com;
    root /srv/hyperaccts/website;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(mjs|js)$ { default_type application/javascript; }
    location /downloads/ { types { application/octet-stream exe; } add_header Content-Disposition attachment; try_files $uri =404; }
    location = /server.mjs { return 404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hyperaccts.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hyperaccts.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.hyperaccts.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hyperaccts.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name hyperaccts.com www.hyperaccts.com;
    return 404; # managed by Certbot




}