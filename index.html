<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><title>HyperAccts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#campaigns"><span class="brand-icon">H<span>↗</span></span><span>HyperAccts<br><b>Workflow marketplace</b></span></a>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <nav aria-label="Main navigation">
        <button data-nav="campaigns"><span>▦</span>Campaigns <small id="nav-count">0</small></button>
        <button data-nav="platforms"><span>◫</span>Platforms</button>
        <button data-nav="marketplace"><span>◇</span>Marketplace</button>
        <button data-nav="creators"><span>⊞</span>Creator studio</button>
        <button data-nav="assistant"><span>✧</span>AI assistant</button>
        <button data-nav="activity"><span>≋</span>Activity</button>
        <button data-nav="connectors"><span>⌘</span>Connectors</button>
        <button data-nav="connections"><span>⇄</span>System status</button>
      </nav>
      <div class="sidebar-next"><span class="tiny">BUILT TO BE SHARED</span><h3>Your next solution.</h3><p>Build a workflow. Package your expertise. Let others make it their own.</p><button class="sidebar-link" data-nav="creators">Open creator studio ↗</button></div>
      <div class="sidebar-foot"><span class="dot"></span><div>Local demo workspace<small>Saved in this browser</small></div></div>
    </aside>
    <main>
      <header class="topbar"><div id="breadcrumb">Workspace <span>/</span> Campaigns</div><div class="topbar-right"><span class="demo-badge"><span class="dot"></span>Simulation mode</span><span class="avatar">HA</span></div></header>
      <div id="app"></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="wizard" aria-labelledby="wizard-title"></dialog>
  <dialog id="details" aria-labelledby="details-title"></dialog>
  <dialog id="solution-dialog" aria-labelledby="solution-title"></dialog>
  <dialog id="creator-editor" aria-labelledby="creator-title"></dialog>
  <dialog id="connector-editor" aria-labelledby="connector-title"></dialog>
  <script type="module" src="app.mjs"></script>
</body>
</html>
